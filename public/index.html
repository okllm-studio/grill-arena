<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grill Arena</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/qrcode.js"></script>
  </head>
  <body>
    <header class="header-bar">
      <div>
        <h1 id="title">Grill Arena</h1>
        <p id="progress" class="progress"></p>
      </div>
      <div class="buttons">
        <button id="rules-button" class="secondary" type="button" aria-expanded="false" aria-controls="rules">Rules</button>
        <button id="scoreboard-button" class="secondary" type="button" aria-expanded="false" aria-controls="scoreboard" hidden>Scoreboard</button>
      </div>
    </header>

    <!-- Sticky controls: Opening and closing stay reachable at the top of the page, whatever the tab. -->
    <section id="controls" class="facilitator controls" hidden></section>
    <section id="rules" class="panel" hidden></section>
    <section id="scoreboard" class="panel" hidden></section>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Sections" hidden></nav>
    <main id="content"></main>
    <section id="results" hidden></section>
    <section id="facilitator" class="facilitator" hidden></section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
